version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: formiq-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formiq_password}
      POSTGRES_DB: ${POSTGRES_DB:-formiq_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formiq_user} -d ${POSTGRES_DB:-formiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formiq-backend
    restart: always
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://formiq_user:formiq_password@postgres:5432/formiq_db}"
      SECRET_KEY: "${SECRET_KEY:-formiq-super-secret-production-grade-key-2026-c8ff3d}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: formiq-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
