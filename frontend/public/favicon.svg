<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="formiq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>
    <linearGradient id="formiq-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9FF66" />
      <stop offset="100%" stop-color="#C8FF3D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Tile -->
  <rect width="64" height="64" rx="14" fill="url(#formiq-bg)" stroke="#262626" stroke-width="1.5" />

  <!-- Stylized FORMIQ Kinetic "F" Monogram -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <path d="M 18 16 L 25 16 L 25 48 L 18 48 Z" fill="url(#formiq-lime)" />
    <!-- Top Horizontal Bar -->
    <path d="M 25 16 L 45 16 C 46.5 16 47.5 17.2 47 18.6 L 45.2 23.4 C 44.8 24.4 43.8 25 42.7 25 L 25 25 Z" fill="url(#formiq-lime)" />
    <!-- Middle Precision Beam -->
    <path d="M 25 29 L 39 29 C 40.2 29 41.1 29.8 40.8 31 L 39.5 35.2 C 39.2 36.2 38.3 36.8 37.3 36.8 L 25 36.8 Z" fill="url(#formiq-lime)" />
  </g>

  <!-- Neon Pulse Kinetic Marker -->
  <circle cx="45" cy="45" r="3.5" fill="#C8FF3D" />
  <circle cx="45" cy="45" r="5.5" stroke="#C8FF3D" stroke-width="0.75" stroke-opacity="0.6" />
</svg>